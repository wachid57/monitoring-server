      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get own extended user detail
      tags:
      - UserProfile
    post:
      consumes:
      - application/json
      description: Creates or updates extended profile fields for authenticated user
      parameters:
      - description: User Detail
        in: body
        name: data
        required: true
